name: Verify downstream

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'PlaywrightMasters/Official-Playwright'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run flint
      - name: Browser smoke tests
        run: npm test -- tests/page/locator-click.spec.ts tests/page/page-goto.spec.ts tests/page/page-fill.spec.ts --workers=2 --reporter=line
      - name: Test runner smoke tests
        run: npm run ttest -- tests/playwright-test/basic.spec.ts --workers=2 --reporter=line
      - name: Verify generated files are current
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
